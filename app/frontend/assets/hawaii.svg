<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Гавайский стикер: пальмы, солнце и остров">
  <defs>
    <clipPath id="sunClip"><circle cx="146" cy="86" r="50"/></clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <g id="sunArt"><circle cx="146" cy="86" r="50" fill="#f0c14b"/></g>
    <g id="palmArt" fill="#171717">
      <!-- main palm trunk -->
      <path d="M 112 86 C 108 112 111 146 117 182 L 128 182 C 122 146 119 112 121 86 Z"/>
      <!-- main palm fronds -->
      <path d="M 116 86 C 94 64 64 54 38 64 C 62 72 90 86 116 86 Z"/>
      <path d="M 116 86 C 100 60 94 34 98 10 C 110 34 118 62 116 86 Z"/>
      <path d="M 116 86 C 108 58 114 32 128 14 C 122 40 120 64 116 86 Z"/>
      <path d="M 116 86 C 132 64 154 48 180 44 C 158 62 138 80 116 86 Z"/>
      <path d="M 116 86 C 142 80 170 84 190 100 C 164 100 136 96 116 86 Z"/>
      <path d="M 116 86 C 102 100 80 110 54 108 C 76 96 98 88 116 86 Z"/>
      <path d="M 116 86 C 136 70 158 60 178 58 C 160 72 138 84 116 86 Z"/>
      <!-- second palm trunk -->
      <path d="M 78 130 C 76 148 79 166 83 184 L 92 184 C 88 166 85 148 87 130 Z"/>
      <!-- second palm fronds -->
      <path d="M 82 130 C 66 114 46 108 26 114 C 46 120 66 128 82 130 Z"/>
      <path d="M 82 130 C 74 110 76 88 86 70 C 88 92 88 114 82 130 Z"/>
      <path d="M 82 130 C 98 116 118 108 138 110 C 118 120 100 128 82 130 Z"/>
      <path d="M 82 130 C 68 142 50 148 32 146 C 48 136 66 132 82 130 Z"/>
      <path d="M 82 130 C 96 140 112 146 128 146 C 112 138 96 134 82 130 Z"/>
      <!-- island -->
      <path d="M 50 188 C 70 175 96 169 122 171 C 148 173 170 180 188 191 C 170 203 140 209 112 209 C 82 209 62 201 50 188 Z"/>
      <!-- water -->
      <path d="M 28 206 q 14 -6 28 0 t 28 0" fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
      <path d="M 152 206 q 14 -6 28 0 t 28 0" fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
      <path d="M 70 218 q 14 -5 28 0 t 28 0" fill="none" stroke="#171717" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </defs>

  <g filter="url(#softShadow)">
    <!-- die-cut белая окантовка -->
    <use href="#sunArt" stroke="#ffffff" stroke-width="18" paint-order="stroke"/>
    <use href="#palmArt" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" paint-order="stroke"/>
    <!-- содержимое -->
    <use href="#sunArt"/>
    <g clip-path="url(#sunClip)" fill="#dfa63a" opacity="0.9">
      <rect x="92" y="48" width="110" height="4" rx="2"/>
      <rect x="92" y="60" width="110" height="4" rx="2"/>
      <rect x="92" y="72" width="110" height="4" rx="2"/>
      <rect x="92" y="84" width="110" height="4" rx="2"/>
      <rect x="92" y="96" width="110" height="4" rx="2"/>
      <rect x="92" y="108" width="110" height="4" rx="2"/>
      <rect x="92" y="120" width="110" height="4" rx="2"/>
    </g>
    <use href="#palmArt"/>
  </g>
</svg>
