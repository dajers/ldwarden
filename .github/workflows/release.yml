name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/package-release.py --version "$VERSION" --output "dist/ldwarden-portable-${VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ldwarden-portable-*.zip
          generate_release_notes: true
